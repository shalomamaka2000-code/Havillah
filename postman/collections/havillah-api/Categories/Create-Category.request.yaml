$kind: http-request
name: Create Category
method: POST
url: '{{baseUrl}}/api/categories'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Electronics",
      "description": "Electronic devices and accessories"
    }
