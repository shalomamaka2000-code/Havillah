$kind: http-request
name: Update Category
method: PUT
url: '{{baseUrl}}/api/categories/{{categoryId}}'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Electronics",
      "description": "Updated description"
    }
